services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessment}
      POSTGRES_USER: ${POSTGRES_USER:-assessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required; URL-encode URI credentials}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      TEACHER_ADMIN_NAME: ${TEACHER_ADMIN_NAME:-Administrator}
      TEACHER_ADMIN_EMAIL: ${TEACHER_ADMIN_EMAIL:?TEACHER_ADMIN_EMAIL is required}
      TEACHER_ADMIN_PASSWORD: ${TEACHER_ADMIN_PASSWORD:?TEACHER_ADMIN_PASSWORD is required}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Your Institution}
      AUDIO_DIR: /app/static/audio
      APP_PORT: ${APP_PORT:-5000}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploaded_audio:/app/static/audio
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_HOST_PORT:-5000}:${APP_PORT:-5000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + '$${APP_PORT:-5000}' + '/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - backend
      - frontend

volumes:
  postgres_data:
  uploaded_audio:

networks:
  backend:
    internal: true
  frontend:
