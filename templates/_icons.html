{% macro icon(name, class_name='', label=None, title=None) -%}
<svg class="ui-icon{% if class_name %} {{ class_name }}{% endif %}"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %} focusable="false"{% if title %} title="{{ title }}"{% endif %}><use href="{{ url_for('static', filename='icons/phosphor-sprite.svg') }}#ph-{{ name }}"></use></svg>
{%- endmacro %}
